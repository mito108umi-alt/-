<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Seagull Flight — Camera Overlay</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Three.js (r152+) from CDN -->
  <script src="https://unpkg.com/three@0.152.2/build/three.min.js"></script>
  <!-- MindAR Image Tracking -->
  <script src="https://unpkg.com/mind-ar@1.1.4/dist/mindar-image-three.prod.js"></script>
</head>
<body>
  <!-- camera video behind the canvas -->
  <video id="cameraFeed" autoplay playsinline muted></video>

  <div id="ui">
    <div class="controls">
      <div style="display:flex;gap:8px;">
        <button id="startCam">Start Camera</button>
        <button id="resetCam">Reset Camera</button>
      </div>
    </div>
  </div>

  <canvas id="c"></canvas>
  <script src="script.js"></script>
</body>
</html>
